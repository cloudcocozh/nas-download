services:
  nas-download:
    build: .
    image: nas-download:1.3.0
    restart: unless-stopped
    stop_grace_period: 150s
    user: "${ND_UID:-1000}:${ND_GID:-1000}"
    environment:
      ND_SETUP_TOKEN: "${ND_SETUP_TOKEN}"
      ND_ENGINE_MODE: existing
    ports:
      - "${ND_BIND:-0.0.0.0}:${ND_PORT:-7120}:7120"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
