name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node web/tests/smoke.cjs
      - run: node web/tests/sites-smoke.cjs
      - run: node web/tests/automations-smoke.cjs
