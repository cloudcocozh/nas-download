<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f5f1"><title>Nas Download · 下载工作台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/automations.js" defer></script></head><body>
<div id="auth" class="auth" hidden><form id="authForm" class="auth-panel"><div class="brand-mark">↓</div><h1>Nas Download</h1><p id="authIntro">登录你的下载工作台</p><label id="setupLabel" hidden>初始化码<input name="setup_token" autocomplete="off"></label><label>用户名<input name="username" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password" minlength="10"></label><p id="authError" class="error" role="alert"></p><button class="primary" type="submit" id="authSubmit">登录</button><small>下载服务与你的 NAS 同步</small></form></div>
<div id="workspace" hidden><header class="topbar"><a class="brand" href="/" aria-label="Nas Download 首页"><span class="brand-mark">↓</span><span>Nas Download<small>下载工作台</small></span></a><div class="top-actions"><span id="connection" class="connection">正在连接</span><button id="settings">设置</button><button id="logout" aria-label="退出登录">退出</button></div></header><main><nav class="section-nav" aria-label="工作台视图"><button id="viewDownloads" aria-pressed="true">下载任务</button><button id="viewResources" aria-pressed="false">资源搜索</button><button id="viewAutomations" aria-pressed="false">自动化</button></nav><div id="downloadView"><div class="heading"><div><h1>下载任务</h1><p>文件有序归位，进度一目了然。</p></div><button id="add" class="primary">＋ 添加任务</button></div><div class="summary" aria-label="下载概况"><div><span>下载速度</span><strong id="downSpeed">—</strong></div><div><span>上传速度</span><strong id="upSpeed">—</strong></div><div><span>正在下载</span><strong id="downCount">—</strong></div><div><span>任务总数</span><strong id="totalCount">—</strong></div></div><section class="task-workspace"><div class="toolbar"><label class="select-label">下载器<select id="downloader"><option value="all">全部下载器</option></select></label><div class="search"><input id="search" type="search" placeholder="搜索任务名称" aria-label="搜索任务名称"><button id="clearSearch" aria-label="清除搜索">×</button></div><button id="refresh" aria-label="刷新任务">↻ 刷新</button></div><nav id="tabs" class="tabs" aria-label="任务状态"><button data-state="all" class="active" aria-pressed="true">全部</button><button data-state="downloading" aria-pressed="false">下载中</button><button data-state="completed" aria-pressed="false">已完成</button><button data-state="paused" aria-pressed="false">已暂停</button></nav><p id="taskError" class="error banner" role="alert" hidden></p><div id="tasks" aria-live="polite"></div><div class="list-footer"><span id="listCount"></span><button id="loadMore" hidden>加载更多</button></div></section></div><section id="resourceView" hidden><div class="heading"><div><h1>资源搜索</h1><p>选择站点搜索，按需添加到下载器。</p></div><button id="manageSites">配置站点</button></div><form id="resourceSearchForm" class="task-workspace resource-form"><label>关键词<input id="resourceQuery" type="search" required placeholder="输入资源名称"></label><div id="resourceSites" class="buttons" aria-label="搜索站点"></div><div class="buttons"><button id="searchResources" class="primary" type="submit">搜索资源</button><button id="stopResources" type="button" disabled>停止搜索</button></div></form><p id="resourceStatus" class="note" role="status"></p><p id="resourceError" class="error" role="alert"></p><div id="resourceResults" class="task-workspace" aria-live="polite"><div class="empty">配置站点并输入关键词开始搜索。</div></div><div class="buttons"><button id="resourceMore" hidden>补取下一页</button></div></section><section id="automationView" hidden aria-labelledby="automationHeading"><div class="heading"><div><h1 id="automationHeading">自动化</h1><p>签到与刷流按计划运行，关闭网页也会继续。</p></div><button id="newAutomation" class="primary">＋ 新建任务</button></div><div class="task-workspace"><div class="automation-toolbar"><nav id="automationTabs" class="tabs" aria-label="自动化类型"><button data-auto-filter="all" class="active" aria-pressed="true">全部</button><button data-auto-filter="daily" aria-pressed="false">签到与账户检查</button><button data-auto-filter="brush" aria-pressed="false">刷流</button></nav><button id="refreshAutomations">↻ 刷新</button></div><p id="automationError" class="error banner" role="alert" hidden></p><div id="automationList" aria-live="polite"><div class="empty">正在读取自动化任务…</div></div><div class="list-footer"><span id="automationCount"></span><span>新任务默认停用</span></div></div><p class="note">只管理在这里创建的配置；不会导入旧任务或接管已有下载。</p></section><footer>Nas Download <span id="version"></span><span id="updated">等待同步</span></footer></main></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog><dialog id="automationDialog" aria-labelledby="automationDialogTitle"><div class="dialog-head"><h2 id="automationDialogTitle"></h2><button id="closeAutomationDialog" aria-label="关闭自动化窗口">×</button></div><div id="automationDialogBody"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
